name: P0 checks
on:
  pull_request:
  push:
    branches: ['feat/**', 'fix/**', 'test/**', 'chore/**']
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: docker compose config --quiet
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.15.8'}
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
