limit_req_zone $binary_remote_addr zone=proposals:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=demo_login:10m rate=6r/m;
server {
    listen 80;
    server_tokens off;
    client_max_body_size 4k;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    error_page 429 = @rate_limited;
    error_page 413 = @too_large;
    location @rate_limited {
        default_type application/json;
        return 429 '{"status":"unavailable","message":"요청이 많습니다. 잠시 후 다시 시도해 주세요."}';
    }
    location @too_large {
        default_type application/json;
        return 413 '{"status":"invalid_input","message":"요청은 4KB 이하여야 합니다."}';
    }
    location = /api/session/login {
        limit_req zone=demo_login burst=3 nodelay;
        limit_req_status 429;
        if ($scheme = http) { return 403; }
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
        access_log off;
    }
    location = /api/parse-change {
        limit_req zone=proposals burst=2 nodelay;
        limit_req_status 429;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
        proxy_read_timeout 25s;
        access_log off;
    }
    location = /api/trust-explain {
        limit_req zone=proposals burst=2 nodelay;
        limit_req_status 429;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
        proxy_read_timeout 25s;
        access_log off;
    }
    location /api/ { proxy_set_header X-Forwarded-Proto $scheme; proxy_pass http://backend:8000; proxy_read_timeout 30s; access_log off; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
